name: habitanexus_widgetbook
description: "Catálogo de widgets de HabitaNexus con Widgetbook — taxonomía Atomic Design."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  widgetbook_annotation: ^3.10.0
  widgetbook: ^3.21.0
  flutter_riverpod: ^2.4.9
  habitanexus_ui:
    path: ../../packages/habitanexus_ui
  # TEMPORAL hasta migración HAB-20: las stories de properties aún muestran
  # widgets que viven en la app (ver NearbyCoworkingsWidget). Al migrarlos a
  # src/{atoms,molecules,organisms}/, eliminar este dep.
  habitanexus_mobile:
    path: ../mobile

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  widgetbook_generator: ^3.21.0

flutter:
  uses-material-design: true
