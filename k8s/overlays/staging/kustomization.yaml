apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base/backend

labels:
  - pairs:
      environment: staging

replicas:
  - name: backend
    count: 2

configMapGenerator:
  - name: backend-config
    literals:
      - LOG_LEVEL=info
      - API_TIMEOUT=30000
      - NODE_ENV=staging