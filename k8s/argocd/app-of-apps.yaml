apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: habitanexus-apps
  namespace: argocd
spec:
  project: habitanexus

  source:
    repoURL: https://github.com/HabitaNexus/monorepo.git
    targetRevision: develop
    path: k8s/argocd/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true