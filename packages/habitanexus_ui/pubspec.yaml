name: habitanexus_ui
description: "HabitaNexus brand package — tokens.json + typed accessors over shared_ui_core (flutter_shared_ui)."
version: 0.2.0
publish_to: 'none'

environment:
  sdk: '>=3.2.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_ui_core:
    git:
      url: https://github.com/chimeranext/flutter_shared_ui
      ref: main
      path: packages/shared_ui_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/style_dictionary/tokens.json
